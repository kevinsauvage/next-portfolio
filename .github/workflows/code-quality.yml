name: Code Quality

on:
  push:

jobs:
  quality:
    name: Lint, Type-check, Prettier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Prettier check
        run: npm run format:check
