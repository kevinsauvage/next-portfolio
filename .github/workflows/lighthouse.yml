name: Lighthouse Audit

on:
  # Vercel deploys on push to main, so this audit is decoupled from GitHub
  # Actions workflows: run it on demand and on a weekly schedule.
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  lighthouse:
    if: ${{ vars.SITE_URL != '' }}
    name: Lighthouse CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: ${{ vars.SITE_URL }}
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  skip-reason:
    if: ${{ vars.SITE_URL == '' }}
    name: Skipped
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "Skipping Lighthouse. SITE_URL repository variable is not set."
